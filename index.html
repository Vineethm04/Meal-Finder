<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Finder</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <header>

        <nav>

            <div class="logo">
                🏠 MEAL FINDER
            </div>

            <div class="menu" id="menu-button">
                ☰
            </div>

        </nav>

    </header>



    <!-- =========================
         SIDE MENU
    ========================= -->

    <div class="side-menu" id="side-menu">

        <button id="close-menu">
            ×
        </button>

        <div id="side-menu-categories">
            <!-- Categories added using JavaScript -->
        </div>

    </div>



    <!-- =========================
         HERO
    ========================= -->

    <section class="hero">

        <div class="search-container">

            <input
                type="text"
                id="search-input"
                placeholder="Search recipes here ..."
            >

            <button id="search-button">
                🔍
            </button>

        </div>


        <h1>
            What are your favorite cuisines?
        </h1>


        <p>
            PERSONALIZE YOUR EXPERIENCE
        </p>

    </section>



    <!-- =========================
         CATEGORY DESCRIPTION
    ========================= -->

    <section class="category-description-section">

        <div id="category-description">
            <!-- Category description -->
        </div>

    </section>



    <!-- =========================
         MEALS
    ========================= -->

    <section class="meals-section">

        <h2>
            Meals
        </h2>


        <div id="meals-container">
            <!-- Meals added using JavaScript -->
        </div>

    </section>



    <!-- =========================
         MEAL DETAILS
    ========================= -->

    <section class="details-section">

        <div class="meal-breadcrumb">

            <span>
                🏠
            </span>

            <span>
                »
            </span>

            <span id="breadcrumb-meal">
                MEAL DETAILS
            </span>

        </div>


        <h2 class="details-heading">
            MEAL DETAILS
        </h2>


        <div id="details-container">
            <!-- Meal details added using JavaScript -->
        </div>

    </section>



    <!-- =========================
         CATEGORIES
    ========================= -->

    <section class="categories-section">

        <h2>
            Categories
        </h2>


        <div id="categories-container">
            <!-- Categories added using JavaScript -->
        </div>

    </section>



    <script src="script.js"></script>

</body>

</html>
